<!DOCTYPE html>
<html lang="it">
<head>
    <meta name="google-site-verification" content="vDRg6d5eBw-8Dt3S5DiJxXB4w_pNs9qwMUM9SwIbWxs" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Parcheggio CL Fontanarossa</title>
    <link rel="icon" type="image/png" href="LogoCLF.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ParkingCLF">
    <link rel="apple-touch-icon" href="LogoCLF.png">

    <style>
        :root { --blue: #3b82f6; --green: #22c55e; --orange: #f59e0b; --red: #ef4444; --gray: #64748b; --light: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f1f5f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 20px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .hidden { display: none; }
        input, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        button { border: none; font-weight: bold; cursor: pointer; color: white; background: var(--blue); }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-green { background: var(--green); }
        .btn-orange { background: var(--orange); }
        .btn-red { background: var(--red); }
        .btn-gray { background: var(--gray); }

        #cal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 250px; overflow-y: auto; margin: 15px 0; padding: 5px; border: 1px solid #eee; border-radius: 10px; }
        .day-slot { padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 13px; background: white; }
        .selected { background: var(--blue) !important; color: white !important; }

        .summary-box { background: var(--light); padding: 15px; border-radius: 12px; text-align: left; margin: 15px 0; border: 1px solid #e2e8f0; font-size: 14px; line-height: 1.6; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>
<div class="card">

    <div id="view-login">
        <h2>🅿️ CLF Fontanarossa</h2>
        <input type="text" id="in-npass" placeholder="CODICE">
        <button onclick="doLogin()">ENTRA</button>
    </div>

    <div id="view-user" class="hidden">
        <h3>Prenotazione</h3>
        <div id="cal-grid"></div>
        <input type="email" id="u-email" placeholder="Email">
        <button onclick="inviaPren()">Invia</button>
        <button onclick="location.reload()">Logout</button>
    </div>

    <div id="view-piantone" class="hidden">
        <h3>Piantone</h3>
        <input type="text" id="search-p">
        <button onclick="cercaPass()">Cerca</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
