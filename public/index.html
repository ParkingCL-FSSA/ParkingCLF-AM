<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Parcheggio CLF</title>
    <style>
        :root { --blue: #3b82f6; --green: #22c55e; --orange: #f59e0b; --red: #ef4444; --gray: #64748b; }
        body { font-family: sans-serif; background: #f1f5f9; padding: 20px; }
        .hidden { display: none; }
        .view { background: white; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: center; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; }
        .btn-blue { background: var(--blue); color: white; }
    </style>
</head>
<body>

    <div id="view-login" class="view">
        <h2>Ingresso Parcheggio</h2>
        <input type="text" id="in-npass" placeholder="Inserisci Codice Pass">
        <button class="btn-blue" onclick="doLogin()">ACCEDI</button>
    </div>

    <div id="view-admin" class="view hidden">
        <h3>📊 Disponibilità Enti</h3>
        <table id="tab-admin"></table>
        <button onclick="location.reload()">LOGOUT</button>
    </div>

    <div id="view-piantone" class="view hidden">
        <h3>🚧 Controllo Sbarra</h3>
        <div id="status-parcheggio" style="background:#e0f2fe; padding:15px; border-radius:10px; color:#0369a1; font-weight:bold; text-align:center; margin-bottom:10px;">
            <span id="total-free-display">Caricamento...</span>
        </div>
        <button onclick="location.reload()">LOGOUT</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
