<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Parcheggio CL Fontanarossa</title>

    <link rel="icon" href="LogoCLF.png">
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="apple-touch-icon" href="LogoCLF.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

    <!-- LOGIN -->
    <div id="view-login">
        <h2>🅿️ CLF Fontanarossa</h2>
        <p>Inserisci il tuo codice</p>

        <input type="text" id="in-npass" placeholder="CODICE" autocomplete="off">

        <button onclick="doLogin()">ENTRA</button>
    </div>

    <!-- USER -->
    <div id="view-user" class="hidden">
        <h3>📅 Prenota Posto</h3>

        <div id="cal-grid"></div>

        <input type="email" id="u-email" placeholder="Email per ricevere il PASS">

        <button onclick="inviaPren()">INVIA PRENOTAZIONE</button>

        <button onclick="mostraMie()">Le mie prenotazioni</button>

        <button onclick="location.reload()">LOGOUT</button>
    </div>

    <!-- SUCCESS -->
    <div id="view-success" class="hidden">
        <h2>✅ Confermata</h2>
        <div id="summary-details"></div>
        <button onclick="location.reload()">OK</button>
    </div>

    <!-- PIANTONE -->
    <div id="view-piantone" class="hidden">
        <h3>Controllo Sbarra</h3>

        <div id="status-parcheggio">
            <span id="total-free-display">Caricamento...</span>
        </div>

        <input type="text" id="search-p" placeholder="Cerca codice">
        <button onclick="cercaPass()">CERCA</button>

        <div id="panel-piantone" class="hidden">
            <h4 id="lab-pass"></h4>
            <p id="lab-periodo"></p>

            <button onclick="mossa('E')">ENTRATA</button>
            <button onclick="mossa('U')">USCITA</button>
        </div>

        <table>
            <tbody id="lista-veicoli"></tbody>
        </table>

        <button onclick="location.reload()">LOGOUT</button>
    </div>

    <button onclick="location.reload()" style="margin-top:20px;">
        🚪 ESCI
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
